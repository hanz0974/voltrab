services:
  backend:
    build: .
    container_name: voltrab-backend
    env_file: .env
    # Hanya bisa diakses dari server itu sendiri; akses publik lewat Nginx
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - models:/app/models
    restart: unless-stopped
    mem_limit: 1g

volumes:
  models:
